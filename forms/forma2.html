<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form 2</title>
  </head>
  <body>
    <h1>Student Registration Form</h1>
    <form action="#" method="get">
      <label for="roll">Roll in: </label>
      <input type="text" name="roll" id="roll" size="50" /> <br />
      <br />
      <label for="">Student name:</label>
      <input type="text" name="" id="" size="20" placeholder="First Name" />
      <input type="text" name="" id="" size="20" placeholder="Last Name" />
      <br />
      <br />
      <label for="fname">Father's Name: </label>
      <input type="text" name="fname" id="fname" size="50" /> <br />
      <br />
      <label for="dob">Date Of Birth: </label>
      <input type="date" name="dob" id="dob" size="50" /> <br />
      <br />
      <label for="mail">Email id:</label>
      <input type="email" name="mail" id="mail" size="50" /> <br />
      <br />
      <label for="pass">Password: </label>
      <input type="password" name="pass" id="pass" size="50" /> <br />
      <br />
      <label for="">Gender: </label>
      <input type="radio" name="gender" id="male" />
      <label for="male">Male</label>
      <input type="radio" name="gender" id="female" />
      <label for="female">Female</label> <br />
      <br />
      <label for="department">Department:</label>
      <select name="department" id="department">
        <option value="cse">CSE</option>
        <option value="it">IT</option>
        <option value="ece">ECE</option>
        <option value="civil">Civil</option>
        <option value="mech">Mech</option>
      </select>
      <br />
      <br />
      <label for="color">Color: </label>
      <input type="color" name="color" id="color" size="50" /> <br />
      <br />
      <label for="photo">Student Photo: </label>
      <input type="file" name="photo" id="photo" /> <br />
      <br />
      <label for="city">City: </label>
      <input type="text" name="city" id="city" size="50" /> <br />
      <br />
      <label for="address">Address: </label>
      <input type="textarea" name="address" id="address" size="50" /> <br />
      <br />
      <input type="submit" value="Register" />
    </form>
  </body>
</html>
