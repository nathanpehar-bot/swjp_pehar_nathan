<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form 2</title>
  </head>
  <body>
    <h1>Student Registration Form</h1>
    <form action="#" method="get">
      <label for="roll">Roll in: </label>
      <input type="text" name="roll" id="roll" size="50" /> <br />
      <br />
      <label for="">Student name:</label>
      <input type="text" name="" id="" size="20" placeholder="First Name" />
      <input type="text" name="" id="" size="20" placeholder="Last Name" />
      <br />
      <br />
      <label for="fname">Father's Name: </label>
      <input type="text" name="fname" id="fname" size="50" /> <br />
      <br />
      <label for="dob">Date Of Birth: </label>
      <input type="date" name="dob" id="dob" size="50" /> <br />
      <br />
      <label for="mail">Email id:</label>
      <input type="email" name="mail" id="mail" size="50" /> <br />
      <br />
      <label for="pass">Password: </label>
      <input type="password" name="pass" id="pass" size="50" /> <br />
      <br />
      <label for="">Gender: </label>
      <input type="radio" name="gender" id="male" />
      <label for="male">Male</label>
      <input type="radio" name="gender" id="female" />
      <label for="female">Female</label> <br />
      <br />
      <label for="">Department</label>
      <input type="checkbox" name="a1" id="cse" />
      <label for="cse">CSE</label>
      <input type="checkbox" name="a2" id="it" />
      <label for="it">IT</label>
      <input type="checkbox" name="a3" id="ece" />
      <label for="ece">ECE</label>
      <input type="checkbox" name="a4" id="civil" />
      <label for="civil">Civil</label>
      <input type="checkbox" name="a5" id="mech" />
      <label for="mech">Mech</label>
      <br />
      <br />
      <label for="course">Course:</label>
      <select name="course" id="course">
        <option value="a">Računalstvo</option>
        <option value="b">Mehatronika</option>
        <option value="c">3D Model</option>
        <option value="d">Elektronika</option>
        <option value="e">Elektrotehnika</option>
      </select>
      <br />
      <br />
      <label for="photo">Student Photo: </label>
      <input type="file" name="photo" id="photo" /> <br />
      <br />
      <label for="city">City: </label>
      <input type="text" name="city" id="city" size="50" /> <br />
      <br />
      <label for="address">Address: </label>
      <textarea name="address" id="address" rows="4" cols="50"></textarea>
      <br />
      <br />
      <input type="submit" value="Register" />
    </form>
  </body>
</html>
